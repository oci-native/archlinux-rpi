name: Build aarch64 bootc image

# Runs the same chain built and verified locally --
# Containerfile.rootfs -> [Containerfile.bootc-native] -> Containerfile.base
# -> Containerfile.rpi -- but natively on an arm64 runner instead of under
# qemu-user emulation on x86_64. Comparing this run's timing and output
# against the local emulated build is the whole point, not just a speed
# convenience -- see docs/bootc-build.md and docs/disk-image.md.
#
# Containerfile.bootc-native replaces Containerfile.bootc here: the
# x86_64 file cross-compiles FOR aarch64, which only makes sense starting
# from an amd64 host. On a host that's already aarch64, cross-compiling
# to aarch64 would mean running the entire amd64 toolchain under
# emulation for no reason. Containerfile.rootfs's own fetch stage still
# needs one small amd64-emulated step, since docker.io/archlinux/archlinux
# has no arm64 manifest at all -- that's what setup-qemu-action is for.
#
# Deliberately does NOT inject secrets.env. That file is gitignored and
# never reaches this runner. This produces an unprovisioned base image
# (and disk image); turning that into the actual `citadel` image with
# real credentials is a local-only step against secrets.env on disk,
# never in CI. See scripts/rpi-disk-image/build-disk-image.sh.
#
# runs-on: adjust if GitHub's current arm64 hosted-runner label differs
# from this at the time you read it -- labels have moved before.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Confirm native arm64
        run: uname -m

      # Only Containerfile.rootfs's fetch stage needs this (amd64,
      # docker.io/archlinux/archlinux has no arm64 manifest). Everything
      # aarch64-targeted in this workflow runs natively without it.
      - name: Register amd64 emulation for the one stage that needs it
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Build ALARM rootfs
        run: time podman build -f Containerfile.rootfs -t localhost/archlinux-arm-base:latest .

      - name: Build bootc natively
        run: time podman build -f Containerfile.bootc-native -t localhost/bootc-aarch64-builder:v1.16.10 .

      - name: Build bootc base
        run: time podman build -f Containerfile.base -t localhost/archlinux-rpi-base:latest .

      - name: Build Pi image
        run: time podman build -f Containerfile.rpi -t localhost/archlinux-rpi:latest .

      - name: Verify bootc --version
        run: podman run --rm localhost/archlinux-rpi:latest bootc --version

      - name: Verify container lint (unskipped -- native, no ENOSYS expected)
        run: podman run --rm --privileged localhost/archlinux-rpi:latest bootc container lint

      - name: Build unprovisioned disk image
        run: |
          sudo ./scripts/rpi-disk-image/build-disk-image.sh rpi-bootc.img 58G localhost/archlinux-rpi:latest /nonexistent-secrets.env

      - name: Save OCI image as artifact
        run: podman save localhost/archlinux-rpi:latest -o archlinux-rpi-oci.tar

      - uses: actions/upload-artifact@v4
        with:
          name: archlinux-rpi-oci
          path: archlinux-rpi-oci.tar

      - uses: actions/upload-artifact@v4
        with:
          name: rpi-bootc-unprovisioned-img
          path: rpi-bootc.img
