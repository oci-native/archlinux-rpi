# Build bootc with the raspberry-pi bootloader backend, natively on arm64.
#
# The patch in vendor/ adds a `raspberry-pi` value to bootc's --bootloader
# flag, which translates ostree's BLS entries into the os_prefix layout the
# VideoCore firmware reads, and sizes the ESP at 1GiB so two deployments'
# worth of kernel, initramfs, device trees and overlays fit.
#
# Runs on an arm64 runner because cross-compiling Rust against bootc's C
# dependencies is fiddly and emulating the build takes hours.
#
# The compile happens inside a Fedora container rather than on the runner
# directly: ostree-sys needs a newer libostree than Ubuntu 24.04 carries
# (noble has 2024.5), and Fedora is what bootc upstream builds against.
name: bootc raspberry-pi binary

on:
  workflow_dispatch:
    inputs:
      registry_tag:
        description: "Ephemeral registry tag to push the binary image to"
        default: "ttl.sh/bupd-bootc-rpi:2h"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: quay.io/fedora/fedora:43
    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          # bootc links ostree, glib, openssl, libselinux, zstd and the
          # util-linux libraries; selinux-sys runs bindgen, which needs libclang.
          dnf install -y --setopt=install_weak_deps=False \
              git-core gcc pkgconf-pkg-config clang-devel \
              rust cargo \
              ostree-devel openssl-devel libzstd-devel glib2-devel \
              libselinux-devel systemd-devel cryptsetup-devel \
              libblkid-devel libmount-devel libcap-devel
          pkg-config --modversion ostree-1
          cargo --version
          rustc --version

      - uses: actions/checkout@v4

      - name: Clone bootc at the pinned base commit
        run: |
          set -euxo pipefail
          base="$(cat vendor/bootc-base-commit.txt)"
          git init bootc
          cd bootc
          git remote add origin https://github.com/bootc-dev/bootc.git
          git fetch --depth 1 origin "$base"
          git checkout FETCH_HEAD
          git log --oneline -1

      - name: Apply the raspberry-pi backend patch
        run: |
          set -euxo pipefail
          cd bootc
          git apply --stat ../vendor/bootc-raspberry-pi.patch
          git apply ../vendor/bootc-raspberry-pi.patch
          grep -q "RaspberryPi" crates/lib/src/spec.rs
          grep -q "install_via_raspberrypi" crates/lib/src/bootloader.rs

      - name: Build
        run: |
          set -euxo pipefail
          cd bootc
          cargo build --release -p bootc
          ls -l target/release/bootc
          file target/release/bootc

      - name: Verify the new bootloader value is accepted
        run: |
          set -euxo pipefail
          cd bootc
          # --help lists the accepted --bootloader values, so this proves the
          # clap ValueEnum picked up the variant without needing root.
          ./target/release/bootc install to-disk --help 2>&1 | tee help.txt
          grep -q "raspberry-pi" help.txt

      - name: Stage
        run: |
          set -euxo pipefail
          mkdir -p out
          cp bootc/target/release/bootc out/bootc
          strip --strip-unneeded out/bootc || true
          sha256sum out/bootc | tee out/bootc.sha256
          cp bootc/help.txt out/install-to-disk-help.txt
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: bootc-aarch64-raspberry-pi
          path: out/
          if-no-files-found: error

  # Pushing needs a container runtime, which is on the runner rather than
  # inside the build container, so it is a separate job.
  publish:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bootc-aarch64-raspberry-pi
          path: out

      # ttl.sh is anonymous and ephemeral, so no credentials are needed and
      # nothing lingers. The image is only a carrier for the binary.
      - name: Push the binary to an ephemeral registry
        run: |
          set -euxo pipefail
          tag="${{ inputs.registry_tag }}"
          chmod +x out/bootc
          printf 'FROM scratch\nCOPY bootc /usr/bin/bootc\n' > out/Dockerfile
          docker build -t "$tag" out
          docker push "$tag"
          echo "pushed $tag"
