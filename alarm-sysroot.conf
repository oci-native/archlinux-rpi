# pacman config used only to resolve and download the ALARM aarch64 package
# closure for Containerfile.bootc's cross-link sysroot. Never used to
# install anything on this (x86_64) host -- always invoked with a throwaway
# --root/--dbpath and -Sw (download only), so no scriptlet from any of these
# packages ever runs. SigLevel is Never because this step only wants the
# files inside each package to extract into a linker sysroot; it is not
# installing them as trusted, running software the way the final image's own
# package install (Never's counterpart, package integrity for the OS itself)
# would need to.
[options]
Architecture = aarch64
SigLevel = Never

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo
